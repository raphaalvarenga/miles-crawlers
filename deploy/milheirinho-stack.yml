# Stack do Milheirinho para o swarm do homelab (colar no Portainer).
#
# Imagens geradas por deploy/build-push.ps1 e enviadas ao registry local.
# Postgres e RabbitMQ continuam onde já estão (192.168.1.40); os endereços
# padrão já vêm nas imagens (appsettings.json da API e config.py do worker).
#
# A ponte (bridge) consome as filas crawl.smiles/azul/latam e entrega os jobs à
# extensão Chrome por HTTP na porta 8765. Na extensão, use http://192.168.1.40:8765.
# Defina BRIDGE_TOKEN nas variáveis de ambiente do stack no Portainer (o mesmo token
# das opções da extensão). Não rode a ponte local ao mesmo tempo: as duas dividiriam
# as filas e metade dos jobs iria para uma ponte sem extensão.

version: "3.8"

services:
  api:
    image: 192.168.1.40:5050/miles-api:latest
    ports:
      - target: 8080
        published: 5000
        protocol: tcp
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Para trocar sem gerar imagem nova, descomente e ajuste:
      # ConnectionStrings__Postgres: "Host=192.168.1.40;Port=5432;Username=postgres;Password=...;Database=milesdb"
      # RabbitMq__Host: "192.168.1.40"
      # Login: tokens do Supabase Auth, validados pelas chaves públicas do projeto.
      # Supabase__Url: "https://xpaxvuxzvsnzleftmjby.supabase.co"
      # Coleta de madrugada dos alertas: só enfileira se a extensão estiver conectada à ponte
      # (lê o /health do serviço bridge desta stack). Vazio desliga a checagem.
      # Alerts__Refresh__BridgeHealthUrl: "http://bridge:8765/health"
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  frontend:
    # O endereço da API foi gravado na imagem no build (NEXT_PUBLIC_API_BASE_URL).
    image: 192.168.1.40:5050/milheirinho-frontend:latest
    ports:
      - target: 3000
        # A 3000 já está em uso no homelab.
        published: 3080
        protocol: tcp
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  bridge:
    image: 192.168.1.40:5050/miles-bridge:latest
    ports:
      - target: 8765
        published: 8765
        protocol: tcp
    environment:
      BRIDGE_TOKEN: ${BRIDGE_TOKEN}
      # Jobs por fila (programa) que a ponte segura ao mesmo tempo. Use o número de
      # extensões ligadas (cada Chrome/Brave/perfil conta uma): com 1, as outras ficam
      # paradas; acima do número de extensões, o job que ninguém pegar volta para a fila.
      PREFETCH_COUNT: ${PREFETCH_COUNT:-1}
      # Job que nenhuma extensão pegar em BRIDGE_CLAIM_TIMEOUT_S volta para a fila do RabbitMQ
      # (até expirar pelo TTL da API, 30 min). Com BRIDGE_REQUEUE_UNCLAIMED=0 ele falha na hora.
      # BRIDGE_REQUEUE_UNCLAIMED: "1"
      # Tempo para uma extensão pegar o job, e para devolver o resultado:
      # BRIDGE_CLAIM_TIMEOUT_S: "60"
      # BRIDGE_JOB_TIMEOUT_S: "90"
      # RABBIT_URL: "amqp://admin:...@192.168.1.40"
      # DATABASE_URL: "postgresql://postgres:...@192.168.1.40:5432/milesdb"
    deploy:
      # Uma réplica só: os jobs ficam na memória da ponte enquanto a extensão os busca.
      replicas: 1
      restart_policy:
        condition: any

  smiles-worker:
    image: 192.168.1.40:5050/miles-smiles-worker:latest
    environment:
      QUEUE_NAME: crawl.smiles
      PREFETCH_COUNT: "1"
      # RABBIT_URL: "amqp://admin:...@192.168.1.40"
      # DATABASE_URL: "postgresql://postgres:...@192.168.1.40:5432/milesdb"
    deploy:
      # Desligado: a Smiles passou a pedir "Validação de segurança" ao Camoufox, e a
      # fila crawl.smiles agora é atendida pela ponte + extensão no Chrome (run_bridge.py).
      # Para voltar a usar o Camoufox, troque para 1 e rode a ponte com
      # BRIDGE_QUEUES=crawl.azul,crawl.latam (as duas não podem dividir a fila).
      replicas: 0
      resources:
        limits:
          memory: 2G
      restart_policy:
        condition: any
