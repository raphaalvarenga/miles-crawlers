<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Milheirinho Coletor</title>
  <link rel="icon" href="icons/icon32.png">
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; color: #1d2433; }
    h1 { font-size: 20px; color: #0B3D91; display: flex; align-items: center; gap: 10px; }
    h1 img { width: 40px; height: 40px; }
    h2 { font-size: 15px; margin-top: 28px; }
    label { display: block; margin: 10px 0 4px; font-weight: 600; }
    input[type=text], input[type=password], input[type=number] { width: 100%; box-sizing: border-box; padding: 6px 8px; }
    .row { display: flex; gap: 12px; } .row > div { flex: 1; }
    .check { font-weight: normal; display: flex; gap: 8px; align-items: center; }
    button { margin: 14px 8px 0 0; padding: 6px 14px; cursor: pointer; }
    pre { background: #f3f5f9; padding: 10px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
    .msg { margin-left: 8px; color: #2f6f3a; }
  </style>
</head>
<body>
  <h1><img src="icons/icon128.png" alt="">Milheirinho Coletor</h1>
  <p>Pega jobs da ponte local (<code>python run_bridge.py</code>), abre a busca da companhia numa aba e devolve o JSON da API de disponibilidade.</p>

  <label class="check"><input type="checkbox" id="enabled"> Ligado</label>
  <label for="bridgeUrl">URL da ponte</label>
  <input type="text" id="bridgeUrl" placeholder="http://127.0.0.1:8765">
  <label for="token">Token (o mesmo de BRIDGE_TOKEN)</label>
  <input type="password" id="token" autocomplete="off">

  <label>Companhias</label>
  <div id="providers"></div>

  <div class="row">
    <div><label for="delayMinS">Intervalo mín. (s)</label><input type="number" id="delayMinS" min="0"></div>
    <div><label for="delayMaxS">Intervalo máx. (s)</label><input type="number" id="delayMaxS" min="0"></div>
    <div><label for="maxPerHour">Máx. buscas/hora</label><input type="number" id="maxPerHour" min="1"></div>
  </div>
  <label class="check"><input type="checkbox" id="foreground"> Abrir a aba da busca em primeiro plano</label>

  <button id="save">Salvar</button>
  <button id="health">Testar ponte</button>
  <button id="resume">Retomar (tirar pausa)</button>
  <span class="msg" id="msg"></span>

  <h2>Estado</h2>
  <pre id="status">carregando…</pre>

  <script type="module" src="options.js"></script>
</body>
</html>
